name: CI/CD Pipeline - ML Test & Quality Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install gunicorn

    - name: Download NLTK Corpora
      run: |
        python -c "import nltk; nltk.download('stopwords', quiet=True); nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True)"

    - name: Run Dataset Acquisition & Cleaning Pipeline
      run: |
        python src/dataset.py

    - name: Train and Benchmark Machine Learning Models
      run: |
        python src/train.py

    - name: Execute Pytest Suite (30 Automated Test Cases)
      run: |
        pytest tests/test_prediction.py -v --tb=short
